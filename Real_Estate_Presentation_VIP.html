<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>برزنتيشن عقاري خاص</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #07090e; }
        .dark-presentation-card { background: linear-gradient(135deg, #111827 0%, #0b0f17 100%); border: 1px solid rgba(245, 158, 11, 0.3); box-shadow: 0 20px 40px -10px rgba(0,0,0,0.7); }
        .glass-panel { background: rgba(17, 24, 39, 0.8); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .gold-btn, .gold-gradient { background: linear-gradient(135deg, #d97706 0%, #b45309 100%); }
    </style>
</head>
<body class="text-slate-100 min-h-screen p-3 flex items-center justify-center">

<div class="max-w-md w-full bg-slate-950 rounded-[2.5rem] shadow-2xl overflow-hidden border border-slate-800 flex flex-col max-h-[95vh]">
    <div class="bg-slate-900/90 p-4 border-b border-slate-800 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-2xl bg-amber-500/10 border border-amber-500/30 flex items-center justify-center text-amber-400 font-black text-lg">✨</div>
            <div>
                <h1 class="text-sm font-black text-white tracking-wide">برزنتيشن عقاري خاص</h1>
                <span class="text-[10px] font-bold text-amber-400/80 tracking-wider">عروض مميزة وحصرية للعملاء</span>
            </div>
        </div>
        <div class="bg-amber-500/10 border border-amber-500/20 px-3 py-1 rounded-full text-amber-400 font-black text-[10px]">VIP PRO</div>
    </div>

    <div class="p-3 bg-slate-900/50 border-b border-slate-800">
        <div class="grid grid-cols-2 bg-slate-900 p-1 rounded-2xl border border-slate-800">
            <button onclick="switchTab('output')" id="tabOutput" class="py-2.5 rounded-xl transition text-slate-950 bg-amber-400 font-black shadow-lg flex items-center justify-center gap-1.5 text-xs"><span>📊</span> عرض البرزنتيشن</button>
            <button onclick="switchTab('input')" id="tabInput" class="py-2.5 rounded-xl transition text-slate-400 hover:text-white font-bold flex items-center justify-center gap-1.5 text-xs"><span>➕</span> إدخال / تعديل</button>
        </div>
    </div>

    <div id="sectionOutput" class="p-4 space-y-4 overflow-y-auto flex-1 bg-slate-950">
        <div class="grid grid-cols-2 gap-2 bg-slate-900 p-1.5 rounded-2xl border border-slate-800">
            <button onclick="switchCategory('residential')" id="btnRes" class="py-2 rounded-xl text-xs font-black transition bg-amber-400 text-slate-950 shadow">🏡 عقارات سكنية</button>
            <button onclick="switchCategory('coastal')" id="btnCoast" class="py-2 rounded-xl text-xs font-black transition text-slate-400 hover:text-white">🌊 عقارات ساحلية</button>
        </div>

        <div class="glass-panel p-4 rounded-3xl space-y-3">
            <div>
                <div class="flex items-center justify-between mb-1">
                    <label class="text-[11px] font-black text-amber-400">🏢 المطور العقاري:</label>
                    <button onclick="deleteCurrentDeveloper()" id="deleteDevBtn" class="text-[10px] bg-rose-500/20 text-rose-300 hover:bg-rose-500 hover:text-white px-2 py-0.5 rounded-lg font-bold transition hidden flex items-center gap-1 border border-rose-500/30">🗑 مسح المطور</button>
                </div>
                <select id="developerSelector" onchange="filterProjectsByDeveloper()" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-xs text-white focus:outline-none focus:border-amber-500 font-bold shadow-sm">
                    <option value="">-- اختر المطور أولاً --</option>
                </select>
            </div>

            <div>
                <div class="flex items-center justify-between mb-1">
                    <label class="text-[11px] font-black text-amber-400">🏙️ اسم المشروع:</label>
                    <button onclick="deleteCurrentProject()" id="deleteProjBtn" class="text-[10px] bg-rose-500/20 text-rose-300 hover:bg-rose-500 hover:text-white px-2 py-0.5 rounded-lg font-bold transition hidden flex items-center gap-1 border border-rose-500/30">❌ مسح المشروع</button>
                </div>
                <select id="projectSelector" onchange="loadSelectedProject()" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-xs text-white focus:outline-none focus:border-amber-500 font-bold shadow-sm">
                    <option value="">-- اختر المشروع --</option>
                </select>
            </div>
        </div>

        <div class="dark-presentation-card text-white p-5 rounded-[2rem] space-y-4 relative">
            <div class="absolute top-4 left-4 flex gap-1.5">
                <button onclick="editCurrentProject()" title="تعديل" class="bg-amber-500/20 hover:bg-amber-500 hover:text-slate-950 text-amber-300 p-1.5 px-3 rounded-xl transition text-xs font-bold shadow-sm flex items-center gap-1 border border-amber-500/30">✏️ تعديل</button>
            </div>

            <div class="border-b border-slate-800 pb-3">
                <span id="outDeveloper" class="text-xs font-black text-amber-400 tracking-wider uppercase block">المطور العقاري</span>
                <h3 id="outProjectName" class="text-2xl font-black text-white mt-1">اسم المشروع</h3>
                <span id="outCategoryBadge" class="inline-block mt-1.5 text-[11px] bg-slate-900 text-amber-300 px-3 py-0.5 rounded-full font-bold border border-slate-800">سكني</span>
            </div>

            <div>
                <span class="text-xs font-black text-amber-400/90 block mb-2.5">📋 الوحدات المتاحة وتفاصيلها (للشرح الاحترافي):</span>
                <div id="outUnits" class="space-y-3"><span class="text-slate-500 text-xs">لم يتم اختيار أو إدخال وحدات لهذا المشروع بعد.</span></div>
            </div>
        </div>

        <button onclick="prepareNewProject()" class="w-full gold-gradient hover:opacity-95 text-white font-black p-3.5 rounded-2xl transition shadow-lg flex items-center justify-center gap-2 text-xs"><span>➕</span> إضافة مشروع جديد للبرزنتيشن</button>
    </div>

    <div id="sectionInput" class="p-4 space-y-4 overflow-y-auto flex-1 hidden bg-slate-950">
        <div class="bg-amber-500/10 border border-amber-500/30 p-2.5 rounded-xl text-xs text-amber-400 font-bold text-center" id="formModeTitle">➕ وضع إضافـة مشروع جديد</div>
        <input type="hidden" id="editingId" value="">

        <div class="grid grid-cols-2 gap-2.5">
            <div>
                <label class="block text-[11px] font-bold text-slate-300 mb-1">🏢 اسم المطور:</label>
                <input type="text" id="developerName" placeholder="مثال: SODIC" class="w-full bg-slate-900 border border-slate-750 rounded-xl p-2.5 text-xs text-white focus:outline-none focus:border-amber-500 shadow-sm font-semibold">
            </div>
            <div>
                <label class="block text-[11px] font-bold text-slate-300 mb-1">🏙️ اسم المشروع:</label>
                <input type="text" id="projectName" placeholder="مثال: SODIC East" class="w-full bg-slate-900 border border-slate-750 rounded-xl p-2.5 text-xs text-white focus:outline-none focus:border-amber-500 shadow-sm font-semibold">
            </div>
        </div>

        <div class="glass-panel p-3 rounded-2xl space-y-1.5">
            <label class="block text-[11px] font-bold text-amber-400">📂 تصنيف المشروع:</label>
            <div class="grid grid-cols-2 gap-2">
                <label class="flex items-center justify-center gap-1.5 p-2 rounded-xl bg-slate-900 border border-slate-700 cursor-pointer text-xs font-bold text-white"><input type="radio" name="projectCategory" value="residential" checked onchange="toggleCategoryForm()" class="text-amber-500"><span>🏡 عقارات سكنية</span></label>
                <label class="flex items-center justify-center gap-1.5 p-2 rounded-xl bg-slate-900 border border-slate-700 cursor-pointer text-xs font-bold text-white"><input type="radio" name="projectCategory" value="coastal" onchange="toggleCategoryForm()" class="text-amber-500"><span>🌊 عقارات ساحلية</span></label>
            </div>
        </div>

        <div id="residentialFormGroup" class="space-y-3">
            <label class="block text-xs font-black text-amber-300">🏠 الوحدات السكنية المستقلة:</label>
            <div id="resUnitsContainer" class="space-y-3"></div>
        </div>

        <div id="coastalFormGroup" class="space-y-3 hidden">
            <label class="block text-xs font-black text-amber-300">🌊 الوحدات الساحلية المستقلة:</label>
            <div id="coastUnitsContainer" class="space-y-3"></div>
        </div>

        <div class="flex gap-2.5 pt-3">
            <button onclick="saveProject()" class="flex-1 gold-gradient hover:opacity-95 text-white font-black p-3.5 rounded-2xl transition shadow-lg text-xs">حفظ البيانات 💾</button>
            <button onclick="clearForm()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-4 py-3.5 rounded-2xl transition font-bold text-xs">إلغاء</button>
        </div>
    </div>
</div>

<script>
let projectsList = JSON.parse(localStorage.getItem('realEstateProjectsCustomV2')) || [];
let currentActiveCategory = 'residential';

const residentialUnitsList = [
    { key: 'apartment', name: '🏢 شقة (Apartment)' },
    { key: 'townhouse', name: '🏡 تاون هاوس (Townhouse)' },
    { key: 'twin', name: '🏠 توين هاوس (Twin House)' },
    { key: 'villa', name: '🏰 فيلا مستقلة (Standalone)' },
    { key: 'ivilla', name: '🏡 آي فيلا (iVilla)' }
];

const coastalUnitsList = [
    { key: 'cabana', name: '🛖 كابينا (Cabana)' },
    { key: 'studio', name: '🛏️ ستوديو (Studio)' },
    { key: 'chalet', name: '🏖️ شاليه (Chalet)' },
    { key: 'coastal_villa', name: '🌴 فيلا ساحلية (Coastal Villa)' }
];

function getInstallmentOptionsHTML(selectedValue = '') {
    let options = '<option value="">-- اختياري --</option>';
    for (let i = 1; i <= 15; i++) {
        let val = i + ' سنين';
        if(i === 1) val = 'سنة واحدة';
        if(i === 2) val = 'سنتين';
        let selected = (selectedValue === val || selectedValue === String(i)) ? 'selected' : '';
        options += `<option value="${val}" ${selected}>${i} ${i <= 2 ? '' : 'سنوات'}</option>`;
    }
    return options;
}

function renderUnitForms() {
    document.getElementById('resUnitsContainer').innerHTML = residentialUnitsList.map(u => createUnitCardHtml(u.key, u.name, 'res')).join('');
    document.getElementById('coastUnitsContainer').innerHTML = coastalUnitsList.map(u => createUnitCardHtml(u.key, u.name, 'coast')).join('');
}

function createUnitCardHtml(key, name, group) {
return `
<div class="bg-slate-900 p-4 rounded-2xl border border-slate-800 space-y-3 shadow-md">
<div class="flex items-center justify-between border-b border-slate-800 pb-2.5">
<label class="flex items-center space-x-2 space-x-reverse cursor-pointer font-black text-white text-xs">
<input type="checkbox" value="${name}" data-group="${group}" class="unit-checkbox rounded text-amber-500 w-4 h-4 bg-slate-800 border-slate-700">
<span class="text-amber-300">${name}</span></label>
<select id="status_${key}" class="text-xs bg-slate-800 border border-slate-700 rounded-xl p-1.5 text-slate-200 font-semibold">
<option value="تشطيب كامل">تشطيب كامل</option><option value="فليكسي فينيشد (3/4 تشطيب)">فليكسي فينيشد (3/4 تشطيب)</option><option value="نصف تشطيب">نصف تشطيب</option><option value="بدون تشطيب">بدون تشطيب</option>
</select></div>
<div class="grid grid-cols-3 gap-2">
<div><label class="block text-[10px] font-bold text-slate-400 mb-1">🛋️ الغرف:</label><select id="rooms_${key}" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2 text-xs text-white font-semibold"><option value="">-- اختياري --</option><option value="1 غرفة">1 غرفة</option><option value="2 غرف">2 غرف</option><option value="3 غرف">3 غرف</option><option value="4+ غرف">4+ غرف</option></select></div>
<div><label class="block text-[10px] font-bold text-slate-400 mb-1">⏳ التقسيط:</label><select id="years_${key}" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2 text-xs text-white font-semibold">${getInstallmentOptionsHTML()}</select></div>
<div><label class="block text-[10px] font-bold text-slate-400 mb-1">📦 الاستلام:</label><select id="delivery_${key}" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2 text-xs text-white font-semibold"><option value="">-- اختياري --</option><option value="استلام فوري">فوري</option><option value="خلال 6 شهور">6 شهور</option><option value="خلال سنة">سنة</option><option value="خلال سنتين">سنتين</option><option value="خلال 3 سنوات">3 سنوات</option><option value="خلال 4 سنوات">4 سنوات</option></select></div>
</div>
<div class="grid grid-cols-2 gap-2">
<div><label class="block text-[10px] font-bold text-slate-400 mb-1">💰 سعر الوحدة:</label><input type="text" placeholder="مثال: 5,000,000" id="price_${key}" oninput="calculateUnitValue('${key}')" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2 text-xs text-white focus:outline-none focus:border-amber-500 font-bold"></div>
<div><label class="block text-[10px] font-bold text-slate-400 mb-1">📊 المقدم:</label>
<div class="flex gap-1 mb-1"><button type="button" onclick="setQuickDp('${key}', '5%')" class="px-1 py-0.5 bg-slate-800 hover:bg-amber-500/20 text-amber-400 text-[10px] font-bold rounded border border-slate-700">5%</button><button type="button" onclick="setQuickDp('${key}', '10%')" class="px-1 py-0.5 bg-slate-800 hover:bg-amber-500/20 text-amber-400 text-[10px] font-bold rounded border border-slate-700">10%</button><button type="button" onclick="setQuickDp('${key}', '20%')" class="px-1 py-0.5 bg-slate-800 hover:bg-amber-500/20 text-amber-400 text-[10px] font-bold rounded border border-slate-700">20%</button></div>
<input type="text" placeholder="مقدم" id="dp_${key}" oninput="calculateUnitValue('${key}')" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2 text-xs text-white focus:outline-none focus:border-amber-500 font-bold"></div></div>
<div id="calc_${key}" class="text-xs text-amber-400 font-black bg-amber-500/10 p-2 rounded-xl border border-amber-500/20 text-center"></div>
</div>`;
}

function switchTab(tab) {
const btnOut=document.getElementById('tabOutput'),btnIn=document.getElementById('tabInput');
if(tab==='input'){sectionInput.classList.remove('hidden');sectionOutput.classList.add('hidden');btnIn.className="py-2.5 rounded-xl transition text-slate-950 bg-amber-400 font-black shadow-lg flex items-center justify-center gap-1.5 text-xs";btnOut.className="py-2.5 rounded-xl transition text-slate-400 hover:text-white font-bold flex items-center justify-center gap-1.5 text-xs";}
else{sectionInput.classList.add('hidden');sectionOutput.classList.remove('hidden');btnOut.className="py-2.5 rounded-xl transition text-slate-950 bg-amber-400 font-black shadow-lg flex items-center justify-center gap-1.5 text-xs";btnIn.className="py-2.5 rounded-xl transition text-slate-400 hover:text-white font-bold flex items-center justify-center gap-1.5 text-xs";updateDeveloperSelector();}
}
function switchCategory(cat){currentActiveCategory=cat;if(cat==='residential'){btnRes.className="py-2 rounded-xl text-xs font-black transition bg-amber-400 text-slate-950 shadow";btnCoast.className="py-2 rounded-xl text-xs font-black transition text-slate-400 hover:text-white";}else{btnCoast.className="py-2 rounded-xl text-xs font-black transition bg-amber-400 text-slate-950 shadow";btnRes.className="py-2 rounded-xl text-xs font-black transition text-slate-400 hover:text-white";}updateDeveloperSelector();}
function toggleCategoryForm(){const c=document.querySelector('input[name="projectCategory"]:checked').value;coastalFormGroup.classList.toggle('hidden',c!=='coastal');residentialFormGroup.classList.toggle('hidden',c==='coastal');}
function setQuickDp(k,v){document.getElementById('dp_'+k).value=v;calculateUnitValue(k);}
function calculateUnitValue(k){const raw=document.getElementById('price_'+k).value.replace(/,/g,'').trim(),price=parseFloat(raw),dp=document.getElementById('dp_'+k),out=document.getElementById('calc_'+k);if(!dp||!out)return;const v=dp.value.trim();if(isNaN(price)||price<=0||!v){out.innerText='';return;}if(v.includes('%')){const pct=parseFloat(v.replace('%',''));if(!isNaN(pct))out.innerText=`✨ قيمة المقدم (${pct}%): ${((price*pct)/100).toLocaleString('en-US')} جنيه`;}else{const n=parseFloat(v.replace(/,/g,''));if(!isNaN(n))out.innerText=`✨ يعادل: ${((n/price)*100).toFixed(1)}% من السعر`;}}
function prepareNewProject(){clearForm();switchTab('input');}
function saveProject(){
const developer=document.getElementById('developerName').value.trim()||'المطور غير محدد',project=document.getElementById('projectName').value.trim()||'مشروع عقاري',editingId=document.getElementById('editingId').value,category=document.querySelector('input[name="projectCategory"]:checked').value;let unitsData=[];
[...residentialUnitsList,...coastalUnitsList].forEach(item=>{const cb=document.querySelector(`input.unit-checkbox[value="${item.name}"]`);if(cb&&cb.checked){let price=document.getElementById('price_'+item.key).value.trim(),dp=document.getElementById('dp_'+item.key).value.trim(),calc='';const n=parseFloat(price.replace(/,/g,''));if(!isNaN(n)&&dp){if(dp.includes('%')){const p=parseFloat(dp.replace('%',''));if(!isNaN(p))calc=`${((n*p)/100).toLocaleString('en-US')} ج`;}else{const d=parseFloat(dp.replace(/,/g,''));if(!isNaN(d))calc=`${((d/n)*100).toFixed(1)}%`;}}unitsData.push({name:item.name,price:price?price+' جنيه':'غير محدد',dp:dp||'غير محدد',status:document.getElementById('status_'+item.key).value,rooms:document.getElementById('rooms_'+item.key).value,years:document.getElementById('years_'+item.key).value,delivery:document.getElementById('delivery_'+item.key).value,calc});}});
const id=editingId||'proj_'+Date.now(),data={id,developer,project,category,unitsData};const idx=projectsList.findIndex(p=>p.id===id);if(idx>=0)projectsList[idx]=data;else projectsList.push(data);localStorage.setItem('realEstateProjectsCustomV2',JSON.stringify(projectsList));clearForm();switchTab('output');switchCategory(category);developerSelector.value=developer;filterProjectsByDeveloper();projectSelector.value=id;loadSelectedProject();}
function editCurrentProject(){const id=projectSelector.value,p=projectsList.find(x=>x.id===id);if(!p)return;editingId.value=p.id;formModeTitle.innerText='✏️ تعديل المشروع: '+p.project;developerName.value=p.developer;projectName.value=p.project;document.querySelector(`input[name="projectCategory"][value="${p.category||'residential'}"]`).checked=true;toggleCategoryForm();document.querySelectorAll('.unit-checkbox').forEach(x=>x.checked=false);[...residentialUnitsList,...coastalUnitsList].forEach(i=>{const k=i.key;['price','dp','rooms','years','delivery'].forEach(f=>{const e=document.getElementById(f+'_'+k);if(e)e.value='';});const s=document.getElementById('status_'+k);if(s)s.value='تشطيب كامل';const c=document.getElementById('calc_'+k);if(c)c.innerText='';});(p.unitsData||[]).forEach(u=>{const i=[...residentialUnitsList,...coastalUnitsList].find(x=>x.name===u.name);if(!i)return;const k=i.key,cb=document.querySelector(`input.unit-checkbox[value="${u.name}"]`);if(cb)cb.checked=true;document.getElementById('price_'+k).value=u.price.replace(' جنيه','');document.getElementById('dp_'+k).value=u.dp==='غير محدد'?'':u.dp;document.getElementById('status_'+k).value=u.status||'تشطيب كامل';document.getElementById('rooms_'+k).value=u.rooms||'';document.getElementById('years_'+k).value=u.years||'';document.getElementById('delivery_'+k).value=u.delivery||'';});switchTab('input');}
function deleteCurrentProject(){const id=projectSelector.value;if(!id)return;if(confirm('هل أنت متأكد من حذف هذا المشروع نهائياً؟')){projectsList=projectsList.filter(x=>x.id!==id);localStorage.setItem('realEstateProjectsCustomV2',JSON.stringify(projectsList));updateDeveloperSelector();clearDisplay();}}
function deleteCurrentDeveloper(){const d=developerSelector.value;if(!d)return;if(confirm(`هل أنت متأكد من حذف المطور "${d}" وجميع مشاريعه المرتبطة به نهائياً؟`)){projectsList=projectsList.filter(p=>!(p.developer===d&&(p.category||'residential')===currentActiveCategory));localStorage.setItem('realEstateProjectsCustomV2',JSON.stringify(projectsList));updateDeveloperSelector();clearDisplay();}}
function updateDeveloperSelector(){const d=developerSelector,current=d.value,ps=projectsList.filter(p=>(p.category||'residential')===currentActiveCategory),devs=[...new Set(ps.map(p=>p.developer))];d.innerHTML='<option value="">-- اختر المطور أولاً --</option>';devs.forEach(x=>{const o=document.createElement('option');o.value=x;o.innerText=x;d.appendChild(o);});if(devs.includes(current)){d.value=current;filterProjectsByDeveloper();deleteDevBtn.classList.remove('hidden');}else{projectSelector.innerHTML='<option value="">-- اختر المشروع --</option>';deleteDevBtn.classList.add('hidden');deleteProjBtn.classList.add('hidden');clearDisplay();}}
function filterProjectsByDeveloper(){const d=developerSelector.value;projectSelector.innerHTML='<option value="">-- اختر المشروع --</option>';deleteProjBtn.classList.add('hidden');clearDisplay();if(!d){deleteDevBtn.classList.add('hidden');return;}deleteDevBtn.classList.remove('hidden');projectsList.forEach(p=>{if(p.developer===d&&(p.category||'residential')===currentActiveCategory){const o=document.createElement('option');o.value=p.id;o.innerText=p.project;projectSelector.appendChild(o);}});}
function loadSelectedProject(){const id=projectSelector.value;if(!id){deleteProjBtn.classList.add('hidden');clearDisplay();return;}deleteProjBtn.classList.remove('hidden');const p=projectsList.find(x=>x.id===id);if(!p)return;outDeveloper.innerText=p.developer;outProjectName.innerText=p.project;outCategoryBadge.innerText=p.category==='coastal'?'🌊 عقار ساحلي':'🏡 عقار سكنى';outUnits.innerHTML=p.unitsData&&p.unitsData.length?p.unitsData.map((u,i)=>`<div class="bg-slate-900/90 p-4 rounded-2xl border border-slate-700/80 text-xs shadow-lg space-y-2.5 relative"><div class="absolute -top-3 right-4 bg-amber-500 text-slate-950 font-black px-2.5 py-0.5 rounded-full text-[10px] shadow">#${i+1}</div><div class="flex justify-between items-center pt-1"><span class="text-white font-black text-sm">${u.name}</span><span class="bg-amber-500/20 text-amber-300 px-2.5 py-1 rounded-xl font-bold text-xs border border-amber-500/30">مقدم: ${u.dp}</span></div><div class="grid grid-cols-2 gap-2 pt-2 border-t border-slate-800 text-xs text-slate-200"><span>💰 السعر: <b class="text-amber-400 font-bold">${u.price}</b></span>${u.years?`<span>⏳ التقسيط: <b class="text-amber-300 font-bold">${u.years}</b></span>`:''}</div><div class="flex flex-wrap justify-between items-center text-xs text-slate-300 pt-1.5 border-t border-slate-800/60 gap-1"><span>🎨 التشطيب: <b class="text-white">${u.status}</b></span>${u.rooms?`<span>🛋️ الغرف: <b class="text-white">${u.rooms}</b></span>`:''}${u.delivery?`<span>📦 الاستلام: <b class="text-white">${u.delivery}</b></span>`:''}</div>${u.calc?`<div class="text-xs text-amber-300 font-bold bg-amber-500/10 p-2 rounded-xl border border-amber-500/20 text-center">✨ قيمة المقدم المطلوبة: ${u.calc} من إجمالي سعر الوحدة</div>`:''}</div>`).join(''):'<span class="text-slate-500 text-xs">لم يتم تحديد أنواع</span>';}
function clearDisplay(){outDeveloper.innerText='المطور العقاري';outProjectName.innerText='اسم المشروع';outCategoryBadge.innerText='-';outUnits.innerHTML='<span class="text-slate-500 text-xs">لم يتم تحديد أنواع</span>';}
function clearForm(){developerName.value='';projectName.value='';document.querySelectorAll('.unit-checkbox').forEach(x=>x.checked=false);[...residentialUnitsList,...coastalUnitsList].forEach(i=>{const k=i.key;['price','dp','rooms','years','delivery'].forEach(f=>{const e=document.getElementById(f+'_'+k);if(e)e.value='';});const s=document.getElementById('status_'+k);if(s)s.value='تشطيب كامل';const c=document.getElementById('calc_'+k);if(c)c.innerText='';});editingId.value='';formModeTitle.innerText='➕ وضع إضافـة مشروع جديد';}
renderUnitForms();updateDeveloperSelector();
</script>
</body>
</html>
